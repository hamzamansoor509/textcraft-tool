
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free online text utility to count words, count characters, change case and clean text.">
  <title>Textify - Free Text Tool</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #182033;
    }

    header {
      background: #fff;
      padding: 20px;
      border-bottom: 1px solid #e5eaf2;
    }

    .nav, main {
      width: min(900px, 92%);
      margin: auto;
    }

    .nav {
      font-size: 22px;
      font-weight: bold;
      color: #4f46e5;
    }

    main { padding: 45px 0; }

    .intro { text-align: center; margin-bottom: 28px; }

    h1 { font-size: clamp(30px, 5vw, 44px); margin: 0 0 12px; }
    .intro p { color: #68738a; line-height: 1.6; }

    .panel {
      background: white;
      padding: 24px;
      border: 1px solid #e5eaf2;
      border-radius: 18px;
      box-shadow: 0 10px 35px #24365c0b;
    }

    textarea {
      width: 100%;
      min-height: 230px;
      resize: vertical;
      border: 1px solid #d8deea;
      border-radius: 12px;
      padding: 16px;
      font: inherit;
      font-size: 16px;
      line-height: 1.6;
      outline: none;
    }

    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px #6366f120;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 18px 0;
    }

    .stat {
      background: #f4f5ff;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .stat strong { display: block; font-size: 25px; color: #4f46e5; }
    .stat span { font-size: 13px; color: #68738a; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #3730a3; }
    button.secondary { background: #eef0ff; color: #4338ca; }
    button.secondary:hover { background: #dfe3ff; }
    button.clear { background: #fff0f0; color: #b42318; }

    #message { min-height: 20px; color: #4f46e5; font-size: 14px; }
    footer { text-align: center; color: #778198; padding: 20px; font-size: 13px; }

    @media (max-width: 500px) {
      main { padding: 28px 0; }
      .panel { padding: 15px; }
      .stats { gap: 7px; }
      .stat { padding: 12px 5px; }
      .stat strong { font-size: 21px; }
      button { flex: 1 1 42%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">✦ Textify</div>
  </header>

  <main>
    <section class="intro">
      <h1>Your Everyday Text Tool</h1>
      <p>Count words, change text case and clean up your text — all for free.</p>
    </section>

    <section class="panel">
      <label for="text"><strong>Enter or paste your text</strong></label>
      <br><br>

      <textarea id="text" placeholder="Start typing or paste your text here..."></textarea>

      <div class="stats">
        <div class="stat">
          <strong id="words">0</strong>
          <span>Words</span>
        </div>
        <div class="stat">
          <strong id="chars">0</strong>
          <span>Characters</span>
        </div>
        <div class="stat">
          <strong id="sentences">0</strong>
          <span>Sentences</span>
        </div>
      </div>

      <strong>Text actions</strong>
      <div class="actions">
        <button type="button" data-action="upper">UPPERCASE</button>
        <button type="button" data-action="lower">lowercase</button>
        <button type="button" data-action="title">Title Case</button>
        <button type="button" class="secondary" data-action="spaces">Remove Extra Spaces</button>
        <button type="button" class="secondary" data-action="copy">Copy Text</button>
        <button type="button" class="clear" data-action="clear">Clear All</button>
      </div>

      <p id="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer>Free Text Utility · Made with HTML, CSS & JavaScript</footer>

  <script>
    const textBox = document.getElementById("text");
    const wordsBox = document.getElementById("words");
    const charsBox = document.getElementById("chars");
    const sentencesBox = document.getElementById("sentences");
    const message = document.getElementById("message");

    function updateStats() {
      const text = textBox.value;
      const trimmed = text.trim();

      wordsBox.textContent = trimmed
        ? trimmed.split(/\s+/u).length
        : 0;

      charsBox.textContent = text.length;

      const sentences = trimmed.match(/[^.!?]+[.!?]+|[^.!?]+$/gu);
      sentencesBox.textContent = sentences
        ? sentences.filter(s => s.trim()).length
        : 0;
    }

    textBox.addEventListener("input", () => {
      updateStats();
      message.textContent = "";
    });

    document.querySelectorAll("button[data-action]").forEach(button => {
      button.addEventListener("click", async () => {
        const action = button.dataset.action;
        const text = textBox.value;

        if (action === "upper") {
          textBox.value = text.toUpperCase();
          message.textContent = "Converted to uppercase.";
        } else if (action === "lower") {
          textBox.value = text.toLowerCase();
          message.textContent = "Converted to lowercase.";
        } else if (action === "title") {
          textBox.value = text.toLowerCase().replace(
            /(^|[\s.!?])(\p{L})/gu,
            (match, separator, letter) =>
              separator + letter.toUpperCase()
          );
          message.textContent = "Converted to title case.";
        } else if (action === "spaces") {
          textBox.value = text.trim().replace(/\s+/gu, " ");
          message.textContent = "Extra spaces removed.";
        } else if (action === "copy") {
          try {
            await navigator.clipboard.writeText(textBox.value);
            message.textContent = "Text copied successfully!";
          } catch {
            textBox.select();
            const copied = document.execCommand("copy");
            message.textContent = copied
              ? "Text copied successfully!"
              : "Please select and copy the text manually.";
          }
          return;
        } else if (action === "clear") {
          textBox.value = "";
          message.textContent = "Text cleared.";
        }

        updateStats();
      });
    });

    updateStats();
  </script>
</body>
</html>
